name: Run Delivery Time Prediction Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # optional: lets you run manually

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter           # <-- needed to run .ipynb files

      - name: Run prediction test (notebook)
        run: |
          jupyter nbconvert --to notebook --execute "Swiggy MLOps Project/RunningTestCases_onDeliveryTimePrediction.ipynb" --output output.ipynb