name: Run Delivery Time Prediction Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Swiggy MLOps Project/requirements.txt"

      - name: Run prediction test
        run: |
          cd "Swiggy MLOps Project/SwiggyDeliveryTimePredictions_TestCasesExecution"
          python delivery_time_prediction.py