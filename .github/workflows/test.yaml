name: Run Delivery Time Prediction Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ".github/workflows/requirements.txt"

      - name: Debug – list installed packages
        run: pip list

      - name: Debug – list model file
        run: |
          cd "Swiggy MLOps Project/SwiggyDeliveryTimePredictions_TestCasesExecution"
          ls -la *.pkl

      - name: Run delivery timeprediction test
        run: |
          cd "Swiggy MLOps Project/SwiggyDeliveryTimePredictions_TestCasesExecution"
          python delivery_time_prediction.py